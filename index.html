<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roulette Wallet</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roulette Wallet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root[data-theme="dark"]{
    --screen-bg:#101014; --card-bg:#17171d; --chip-bg:#1c1c22; --chip-hover-bg:#26262e;
    --primary-text:#f5f4f2; --fg-rgb:245,244,242; --track-off-bg:rgba(255,255,255,0.14);
    --sep-color:rgba(255,255,255,0.08);
  }
  :root[data-theme="light"]{
    --screen-bg:#f7f6f3; --card-bg:#ffffff; --chip-bg:color-mix(in srgb, var(--accent) 16%, white);
    --chip-hover-bg:color-mix(in srgb, var(--accent) 28%, white);
    --primary-text:#17171d; --fg-rgb:23,23,29; --track-off-bg:color-mix(in srgb, var(--accent) 16%, white);
    --sep-color:rgba(0,0,0,0.08);
  }
  :root{ --accent:#ff4d6d; --accent-rgb:255,77,109; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b0b0f; padding:40px; font-family:'Manrope', system-ui, sans-serif;
  }
  @keyframes wr-toast-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes wr-flash-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes wr-predict-pulse{
    0%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),0.55); }
    100%{ box-shadow:0 0 0 10px rgba(var(--accent-rgb),0); }
  }
  @keyframes wr-row-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  .phone{
    width:412px; height:892px; border-radius:44px; background:#000; padding:14px;
    box-shadow:0 30px 80px rgba(0,0,0,0.55); position:relative;
  }
  .screen{
    height:100%; width:100%; display:flex; flex-direction:column;
    background:var(--screen-bg); color:var(--primary-text); box-sizing:border-box;
    padding:22px 20px 24px; position:relative; border-radius:32px;
    overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none;
    /* Normally everything fits with no visible scroll. This is a safety
       net for phones where the fixed-size reel area doesn't leave enough
       room - without it, content that doesn't fit (like the Log expense
       button) would be clipped with no way to reach it, now that the
       outer page itself is locked from scrolling. */
  }
  .screen::-webkit-scrollbar{ display:none; }
  /* On an actual phone the browser viewport already *is* the phone - drop
     the decorative bezel/frame so the app fills the real screen edge to
     edge instead of rendering a tiny mockup phone inside it. */
  @media (max-width:480px), (display-mode:standalone){
    body{ padding:0; background:var(--screen-bg); }
    .phone{
      width:100vw; border-radius:0; padding:0; box-shadow:none; background:var(--screen-bg);
      height:100vh; height:100svh; /* svh = smallest viewport height, so it never renders taller than what's actually visible (dvh briefly reports a too-tall value right after a reload, which is what was pushing the page into a scrollable state) */
    }
    .screen{ border-radius:0; padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom)); }
  }

  .row-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex:0 0 auto; gap:8px; }
  .row-top-right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .chip{
    width:36px; height:36px; border-radius:12px; background:var(--chip-bg);
    display:flex; align-items:center; justify-content:center; font-size:20px;
    color:rgba(var(--fg-rgb),0.75); cursor:pointer; user-select:none; flex:0 0 auto;
  }
  .chip:hover{ background:var(--chip-hover-bg); }
  .chip.chip-ghost{ visibility:hidden; pointer-events:none; }
  .title{ font-size:16px; font-weight:600; color:var(--primary-text); flex:1; text-align:center; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .card{
    background:var(--card-bg); border-radius:20px; padding:18px 20px; display:flex;
    flex-direction:column; gap:6px; margin-bottom:24px;
  }
  .card-label{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:rgba(var(--fg-rgb),0.45); }
  .card-main{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .amount-row{ display:flex; align-items:baseline; gap:10px; min-height:24px; }
  .amount-text{ font-size:32px; font-weight:800; color:var(--primary-text); }
  .flash{ font-size:13px; font-weight:700; color:var(--accent); animation:wr-flash-in 0.2s ease; display:none; }
  .flash.show{ display:inline; }
  .total-toggle{ display:flex; align-items:center; gap:6px; cursor:pointer; padding-bottom:3px; user-select:none; }
  .toggle-label{ font-size:11px; font-weight:600; color:rgba(var(--fg-rgb),0.55); }
  .toggle-track{
    width:36px; height:20px; border-radius:100px; padding:2px; box-sizing:border-box;
    display:flex; transition:background 0.15s ease; background:var(--track-off-bg); justify-content:flex-start;
  }
  .toggle-track.on{ background:var(--accent); justify-content:flex-end; }
  .toggle-knob{ width:16px; height:16px; border-radius:50%; background:#fff; }
  .subtitle{ font-size:11px; font-weight:600; color:var(--accent); display:none; }
  .subtitle.show{ display:block; }

  .reels-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .reel-titles{ display:flex; justify-content:space-between; padding:0 4px; margin-bottom:10px; }
  .reel-title-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .reel-title{ font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); }

  .reels-area{ position:relative; height:clamp(200px, 30vh, 280px); }
  .band{
    position:absolute; left:-4px; right:-4px; top:50%; transform:translateY(-50%);
    height:56px; border-top:1px solid var(--accent); border-bottom:1px solid var(--accent); pointer-events:none;
  }
  .reels-row{ display:flex; height:100%; position:relative; z-index:1; }
  .reel{
    flex:1; position:relative; overflow:hidden; touch-action:none; cursor:grab; border-radius:10px;
    -webkit-mask-image:linear-gradient(to bottom, transparent, black 22%, black 78%, transparent);
    mask-image:linear-gradient(to bottom, transparent, black 22%, black 78%, transparent);
  }
  .reel:active{ cursor:grabbing; }
  .reel.predicted-pulse{ animation: wr-predict-pulse 0.7s ease; }
  .slot{
    position:absolute; left:0; right:0; top:50%; display:flex; align-items:center; justify-content:center;
    height:56px; padding:0 6px; box-sizing:border-box; pointer-events:none;
  }
  .slot-label{
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-align:center; display:block;
  }
  .fine-btn{
    position:absolute; top:50%; width:26px; height:56px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; cursor:pointer; z-index:2; color:rgba(var(--fg-rgb),0.28);
  }
  .fine-btn:hover{ color:rgba(var(--fg-rgb),0.65); }
  .fine-minus{ left:50%; transform:translate(-100%,-50%); margin-left:-34px; }
  .fine-plus{ left:50%; transform:translate(0,-50%); margin-left:34px; }

  .add-row{ display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
  .add-col{ flex:1; display:flex; justify-content:center; }
  .add-chip{
    width:36px; height:36px; border-radius:10px; background:var(--chip-bg);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:rgba(var(--fg-rgb),0.7);
  }
  .add-chip:hover{ background:var(--chip-hover-bg); }
  .add-chip:active{ transform:scale(0.94); }

  .cta-wrap{ position:relative; margin-top:18px; flex:0 0 auto; }
  .toast{
    position:absolute; left:50%; bottom:76px; transform:translate(-50%,0); background:#1c1c22; color:#f5f4f2;
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:100px; white-space:nowrap;
    animation:wr-toast-in 0.25s ease; box-shadow:0 8px 20px rgba(0,0,0,0.4); max-width:340px;
    overflow:hidden; text-overflow:ellipsis; display:none;
  }
  .toast.show{ display:block; }
  .cta{
    background:var(--accent); border-radius:18px; padding:16px; display:flex; flex-direction:column;
    align-items:center; gap:2px; cursor:pointer; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  :root[data-theme="light"] .cta{ background:color-mix(in srgb, var(--accent) 55%, white); }
  .cta:active{ transform:scale(0.97); }
  .cta:hover{ filter:brightness(1.06); }
  .cta-main{ font-size:15px; font-weight:800; color:#1a0508; }
  .cta-sub{ font-size:12px; font-weight:600; color:rgba(26,5,8,0.65); }

  .entry-view{ flex:1; display:flex; flex-direction:column; min-height:0; }

  .history-view{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .sync-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 16px; border-radius:14px; background:var(--card-bg); margin-bottom:12px; flex:0 0 auto;
  }
  .sync-info{ font-size:11.5px; font-weight:600; color:rgba(var(--fg-rgb),0.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .sync-btn{ font-size:11.5px; font-weight:700; color:var(--accent); cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .sync-btn:hover{ filter:brightness(1.15); }
  .history-summary{
    background:var(--card-bg); border-radius:20px; padding:16px 20px; display:flex;
    justify-content:space-between; align-items:center; margin-bottom:16px; flex:0 0 auto;
  }
  .history-summary-count{ font-size:12px; font-weight:600; color:rgba(var(--fg-rgb),0.55); }
  .history-summary-total{ font-size:18px; font-weight:800; color:var(--primary-text); }
  .history-list{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .history-list::-webkit-scrollbar{ display:none; }
  .history-row{
    display:flex; align-items:center; gap:10px;
    padding:13px 4px; border-bottom:1px solid var(--sep-color); animation:wr-row-in 0.18s ease;
  }
  .history-left{ flex:1; min-width:0; }
  .history-cat{ font-size:14px; font-weight:700; color:var(--primary-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-mode{ font-size:11.5px; font-weight:600; color:rgba(var(--fg-rgb),0.5); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-amount{ font-size:14px; font-weight:800; color:var(--accent); white-space:nowrap; flex:0 0 auto; }
  .history-empty{ font-size:13px; font-weight:600; color:rgba(var(--fg-rgb),0.4); text-align:center; padding:60px 20px; }
  .history-actions{ flex:0 0 auto; display:flex; justify-content:center; align-items:center; gap:18px; padding:14px 0 2px; }
  .history-action{ font-size:12px; font-weight:700; cursor:pointer; color:var(--accent); }
  .history-action:hover{ filter:brightness(1.15); }
  .history-action-danger{ color:rgba(var(--fg-rgb),0.4); }
  .history-action-danger:hover{ color:var(--accent); filter:none; }
  .history-delete{
    flex:0 0 auto; width:28px; height:28px; border-radius:9px; display:flex; align-items:center;
    justify-content:center; color:rgba(var(--fg-rgb),0.32); cursor:pointer;
  }
  .history-delete:hover{ color:var(--accent); background:var(--chip-bg); }

  .modal-overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.55); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px; box-sizing:border-box;
  }
  .modal-overlay.show{ display:flex; }
  #modalOverlay{ z-index:60; } /* stacks above the manage-list overlay when edit/confirm opens on top of it */
  .modal-card{
    width:100%; max-width:340px; background:var(--card-bg); border-radius:22px;
    padding:22px; box-sizing:border-box; margin:0 auto; max-height:calc(100% - 40px); overflow-y:auto;
    animation:wr-modal-in 0.18s ease;
  }
  @keyframes wr-modal-in{ from{ transform:scale(0.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-title{ font-size:15px; font-weight:700; color:var(--primary-text); margin-bottom:14px; }
  .modal-message{ font-size:13.5px; font-weight:500; color:rgba(var(--fg-rgb),0.7); line-height:1.5; margin-bottom:18px; }
  .modal-input{
    width:100%; background:var(--chip-bg); border:1.5px solid transparent; border-radius:12px;
    padding:13px 14px; font-size:15px; font-family:inherit; color:var(--primary-text);
    box-sizing:border-box; outline:none; margin-bottom:16px;
  }
  .modal-input:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; gap:10px; }
  .modal-btn{
    flex:1; text-align:center; padding:13px; border-radius:14px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .modal-btn-cancel{ background:var(--chip-bg); color:rgba(var(--fg-rgb),0.7); }
  .modal-btn-cancel:hover{ background:var(--chip-hover-bg); }
  .modal-btn-save{ background:var(--accent); color:#1a0508; }
  :root[data-theme="light"] .modal-btn-save{ background:color-mix(in srgb, var(--accent) 55%, white); }
  .modal-btn-save:hover{ filter:brightness(1.06); }
  .modal-btn-danger{ background:#e5484d; color:#2a0505; }
  .modal-btn-danger:hover{ filter:brightness(1.08); }

  .manage-card{ max-height:78vh; overflow-y:hidden; display:flex; flex-direction:column; }
  .manage-list{
    overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; min-height:0; margin-bottom:14px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .manage-list::-webkit-scrollbar{ display:none; }
  .manage-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 2px; border-bottom:1px solid var(--sep-color);
  }
  .manage-row:last-child{ border-bottom:none; }
  .manage-row-label{
    font-size:14.5px; font-weight:600; color:var(--primary-text); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .manage-row.selected .manage-row-label{ color:var(--accent); }
  .manage-row-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .manage-row-btn{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color:rgba(var(--fg-rgb),0.45); cursor:pointer; background:var(--chip-bg);
  }
  .manage-row-btn:hover{ color:var(--accent); background:var(--chip-hover-bg); }
  .manage-row-btn-danger:hover{ color:#e5484d; }
  .manage-add-row{ display:flex; gap:8px; align-items:center; margin-bottom:16px; }
  .manage-add-row .modal-input{ margin-bottom:0; }
  .manage-add-btn{
    flex:0 0 auto; width:46px; height:46px; border-radius:12px; background:var(--accent);
    color:#1a0508; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; cursor:pointer;
  }
  :root[data-theme="light"] .manage-add-btn{ background:color-mix(in srgb, var(--accent) 55%, white); }
  .manage-add-btn:hover{ filter:brightness(1.06); }
  .manage-add-btn:active{ transform:scale(0.94); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen" data-theme="dark">

    <div class="row-top">
      <div class="chip" id="navChip" title="Transactions"></div>
      <div class="title" id="titleEl">Scroll n Add</div>
      <div class="row-top-right">
        <div class="chip" id="installChip" title="Install app" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="3.5" y="1" width="7" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"></rect><path d="M7 5v4M5 7h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>
        </div>
        <div class="chip" id="themeToggle" title="Toggle theme"></div>
        <div class="chip" id="backChip" title="Back" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
      </div>
    </div>

    <div class="entry-view" id="entryView">
      <div class="card">
        <div class="card-label">Spent this month</div>
        <div class="card-main">
          <div class="amount-row">
            <div class="amount-text" id="amountText">₹0</div>
            <div class="flash" id="flashText"></div>
          </div>
          <div class="total-toggle" id="totalToggle">
            <span class="toggle-label">Total</span>
            <div class="toggle-track on" id="toggleTrack">
              <div class="toggle-knob"></div>
            </div>
          </div>
        </div>
        <div class="subtitle" id="subtitle"></div>
      </div>

      <div class="reels-wrap">
        <div class="reel-titles" id="reelTitles"></div>

        <div class="reels-area">
          <div class="band"></div>
          <div class="reels-row" id="reelsRow"></div>
        </div>

        <div class="add-row" id="addRow"></div>
      </div>

      <div class="cta-wrap">
        <div class="toast" id="toast"></div>
        <div class="cta" id="ctaBtn">
          <div class="cta-main">Log expense</div>
          <div class="cta-sub" id="ctaPreview"></div>
        </div>
      </div>
    </div>

    <div class="history-view" id="historyView" style="display:none;">
      <div class="sync-bar" id="syncBar" style="display:none;">
        <div class="sync-info" id="syncInfo">Saved on this device only</div>
        <div class="sync-btn" id="syncBtn">Sign in with Google</div>
      </div>
      <div class="history-summary">
        <div class="history-summary-count" id="historyCount">0 transactions</div>
        <div class="history-summary-total" id="historyTotal">₹0</div>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="history-actions">
        <div class="history-action" id="historyExport">Export CSV</div>
        <div class="history-action history-action-danger" id="historyClear">Clear all</div>
      </div>
    </div>

    <div class="modal-overlay" id="manageOverlay">
      <div class="modal-card manage-card">
        <div class="modal-title" id="manageTitle">Manage categories</div>
        <div class="manage-list" id="manageList"></div>
        <div class="manage-add-row">
          <input class="modal-input" id="manageAddInput" type="text" autocomplete="off" placeholder="Add new...">
          <div class="manage-add-btn" id="manageAddBtn">+</div>
        </div>
        <div class="modal-actions">
          <div class="modal-btn modal-btn-cancel" id="manageDoneBtn">Done</div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-title" id="modalTitle">Enter value</div>
        <div class="modal-message" id="modalMessage" style="display:none;"></div>
        <input class="modal-input" id="modalInput" type="text" autocomplete="off">
        <div class="modal-actions">
          <div class="modal-btn modal-btn-cancel" id="modalCancel">Cancel</div>
          <div class="modal-btn modal-btn-save" id="modalSave">Save</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
(async function(){
  const ITEM_H = 56;
  const FEEL = { decay: 0.08, k: 90, c: 18 };
  const STORAGE_KEY = 'rouletteWalletTransactions';

  // ---- Firebase (optional cross-device sync) ----

    apiKey: "AIzaSyDN6mXxeO58avD7GORRrHLPCkRlDcQwGgI",
    authDomain: "roulette-wallet.firebaseapp.com",
    projectId: "roulette-wallet",
    storageBucket: "roulette-wallet.firebasestorage.app",
    messagingSenderId: "543737534991",
    appId: "1:543737534991:web:92586f6b224c799b68a17a",

  function mod(n, m){ return ((n % m) + m) % m; }

  function buildRange(min, max, step){
    const arr = [];
    for (let v = min; v <= max; v += step) arr.push(v);
    if (arr[arr.length-1] !== max) arr.push(max);
    return arr;
  }

  // "Spent this month" and the per-mode split are derived fresh from the
  // transaction log every render, rather than tracked as running counters.
  // That keeps them correct automatically when transactions arrive from
  // another device via sync.
  function computeMonthTotals(){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    let total = 0;
    const byMode = {};
    state.transactions.forEach(t => {
      const d = new Date(t.timestamp);
      if (d.getFullYear() === y && d.getMonth() === m){
        total += t.amount;
        byMode[t.mode] = (byMode[t.mode] || 0) + t.amount;
      }
    });
    return { total, byMode };
  }

  // --- auto-fill ("usual pick" for a category) ---
  // Not a trained model: it looks at your past logged transactions for this
  // category and learns two things:
  //  - typical amount: a recency-weighted average (recent spends count more
  //    than old ones), snapped to the nearest value on that category's reel.
  //    Using an average instead of an exact-match makes this useful even
  //    when the amount is rarely identical twice (e.g. petrol fill-ups).
  //  - usual payment mode: recency-weighted most-frequent mode, so it still
  //    adapts if your payment habits shift over time.
  function weightedMostFrequent(rowsAsc, key){
    const weights = new Map();
    rowsAsc.forEach((r, i) => {
      const w = i + 1; // later index = more recent = heavier weight
      weights.set(r[key], (weights.get(r[key]) || 0) + w);
    });
    let best = null, bestW = -1;
    weights.forEach((w, v) => { if (w > bestW){ bestW = w; best = v; } });
    return best;
  }
  function nearestIndex(values, target){
    let bestI = 0, bestDiff = Infinity;
    values.forEach((v, i) => {
      const diff = Math.abs(v - target);
      if (diff < bestDiff){ bestDiff = diff; bestI = i; }
    });
    return bestI;
  }
  function predictForCategory(catValue){
    const rows = state.transactions
      .filter(t => t.category === catValue)
      .sort((a, b) => a.timestamp - b.timestamp);
    if (!rows.length) return null;
    let wSum = 0, wTotal = 0;
    rows.forEach((r, i) => {
      const w = i + 1;
      wSum += r.amount * w;
      wTotal += w;
    });
    return {
      amount: wSum / wTotal,
      mode: weightedMostFrequent(rows, 'mode'),
      sampleSize: rows.length,
    };
  }

  // Snap a reel to a specific value index, taking the shortest wrap-around
  // path from its current position, then flash a highlight so the user
  // notices the auto-fill happened.
  function spinTo(key, targetIndex){
    if (targetIndex == null || targetIndex < 0) return;
    const len = reelsConfig[key].values.length;
    const cur = state.positions[key];
    const candidate = targetIndex + len * Math.round((cur - targetIndex) / len);
    state.positions[key] = candidate;
    state.velocities[key] = 0;
    if (key === 'amount') state.amountFine = 0;
    renderReel(key);
    renderTotals();
    renderCta();
    pulse(key);
  }

  function pulse(key){

    el.classList.remove('predicted-pulse');

    el.classList.add('predicted-pulse');
    setTimeout(() => el.classList.remove('predicted-pulse'), 700);
  }

  function handleCategoryChange(catValue){
    reelsConfig.amount.values = getAmountValuesForCategory(catValue);

    const prediction = predictForCategory(catValue);
    if (prediction){
      spinTo('amount', nearestIndex(reelsConfig.amount.values, prediction.amount));
      if (prediction.mode != null){
        const modeIdx = reelsConfig.mode.values.indexOf(prediction.mode);
        if (modeIdx >= 0) spinTo('mode', modeIdx);
      }
      showPredictionToast(catValue, prediction.sampleSize);
    } else {
      handleShuffle('amount');
    }
  }

  // Small in-app bottom-sheet used instead of window.prompt()/window.confirm()

  let modalResolve = null;
  function showModal({ title, message = null, initialValue = '', inputType = 'text', okText = 'Save', danger = false }){
    return new Promise(resolve => {
      modalResolve = resolve;
      modalTitleEl.textContent = title;
      const isConfirm = message != null;
      modalMessageEl.style.display = isConfirm ? '' : 'none';
      modalInputEl.style.display = isConfirm ? 'none' : '';

  const HISTORY_ICON = '<svg width="15" height="15" viewBox="0 0 15 15"><path d="M1.5 3.5h12M1.5 7.5h12M1.5 11.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>';

  // Build static per-reel DOM once (5 slot placeholders each), keep refs.
  const reelEls = {};
  order.forEach(key => {

  function adjustFine(dir){

  function handleDown(key, e){
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}
    drag[key] = { y: e.clientY, t: performance.now(), pos: state.positions[key] };
    state.dragging[key] = true;
    state.velocities[key] = 0;
    if (key === 'amount') { state.amountFine = 0; renderCta(); }
  }

  function handleMove(key, e){
    const d = drag[key];
    if (!d || !state.dragging[key]) return;
    const now = performance.now();
    const deltaY = e.clientY - d.y;
    const newPos = d.pos - deltaY / ITEM_H;
    const dt = Math.max((now - (d.lastT || d.t)) / 1000, 0.001);
    const instV = d.lastPos != null ? (newPos - d.lastPos) / dt : 0;
    d.lastT = now; d.lastPos = newPos;
    state.positions[key] = newPos;
    state.velocities[key] = instV;
    renderReel(key);
    renderTotals();
    renderCta();
  }

  function handleUp(key){
    if (!state.dragging[key]) return;
    state.dragging[key] = false;

  // --- manage-values modal: add, edit, or delete a reel's entries in one place ---
  const MANAGE_TITLES = { category: 'Manage categories', amount: 'Manage amounts', mode: 'Manage modes' };

  // Keeps the reel pointed at the same logical value (or clamps sanely if
  // that value no longer exists) after the list underneath it changes shape -
  // edits can re-sort the amount list, deletes can shift every index after
  // the removed one.
  function syncPositionAfterListChange(key, targetValue){
    const cfg = reelsConfig[key];
    const len = cfg.values.length;
    if (!len) return;
    if (targetValue != null){
      const idx = cfg.values.indexOf(targetValue);
      state.positions[key] = idx >= 0 ? idx : 0;
    } else {
      state.positions[key] = Math.min(mod(Math.round(state.positions[key]), len), len - 1);
    }
    state.velocities[key] = 0;
    if (key === 'amount') state.amountFine = 0;
  }

  function currentCategoryValue(){
    const cfg = reelsConfig.category;

  // Call after any add/edit/delete in the manage sheet, regardless of which
  // reel it touched: snapshots the amount list under whatever category is
  // currently selected, saves everything locally, and pushes it to Firestore
  // if signed in.
  function persistReelValues(){
    amountByCategory[currentCategoryValue()] = reelsConfig.amount.values.slice();
    saveReelValues();
    syncReelValuesToCloud();
  }

  function renderManageList(){

    manageListEl.innerHTML = '';
    cfg.values.forEach((v, i) => {
      const row = document.createElement('div');
      row.className = 'manage-row' + (i === selIdx ? ' selected' : '');

        if (key === 'amount'){
          newVal = parseFloat(String(raw).replace(/[^0-9.]/g, ''));
          if (isNaN(newVal)) return;
        } else {
          newVal = String(raw).trim();
          if (!newVal) return;

        if (newVal === v) return;
        // Track the reel's selection by its VALUE, not this row's index -
        // editing some other row shouldn't drag the current selection onto
        // whatever just got renamed.
        const wasSelected = i === selIdx;
        const trackValue = wasSelected ? newVal : cfg.values[selIdx];
        cfg.values[i] = newVal;
        if (key === 'amount') cfg.values.sort((a, b) => a - b);
        syncPositionAfterListChange(key, trackValue);
        persistReelValues();
        renderManageList();
        renderReel(key);
        renderCta();

      const delBtn = document.createElement('div');
      delBtn.className = 'manage-row-btn manage-row-btn-danger';

      });

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(label);
      row.appendChild(actions);
      manageListEl.appendChild(row);
    });
  }

  function manageAddValue(){
    const key = manageKey;
    const cfg = reelsConfig[key];
    const raw = manageAddInputEl.value;
    if (!raw || !String(raw).trim()) return;
    let value;
    if (key === 'amount'){
      value = parseFloat(String(raw).replace(/[^0-9.]/g, ''));
      if (isNaN(value)) return;
    } else {
      value = String(raw).trim();
      if (!value) return;
    }
    const currentSelected = cfg.values[mod(Math.round(state.positions[key]), cfg.values.length)];
    if (!cfg.values.includes(value)){
      cfg.values.push(value);
      if (key === 'amount') cfg.values.sort((a, b) => a - b);
    }
    syncPositionAfterListChange(key, currentSelected);
    persistReelValues();
    manageAddInputEl.value = '';
    renderManageList();
    renderReel(key);
    renderCta();
  }
  manageAddBtnEl.addEventListener('pointerup', manageAddValue);
  manageAddInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); manageAddValue(); } });

  // Adds a transaction either to Firestore (when signed in, so it syncs to
  // every device) or to localStorage (device-only). Firestore's onSnapshot
  // listener (see onSignedIn) is what actually updates state.transactions
  // and re-renders in the cloud case.
  function addTransaction(record){
    if (fb && state.user){
      fb.fsMod.addDoc(collectionRef(), record).catch(err => {
        console.error('Could not save to the cloud, keeping it on this device instead.', err);
        state.transactions.push({ id: 'local-' + Date.now(), ...record });
        saveTransactions();
        if (state.view === 'history') renderHistory();
      });
    } else {
      state.transactions.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        ...record,
      });
      saveTransactions();
    }
  }

  function logExpense(){
    const idx = k => mod(Math.round(state.positions[k]), reelsConfig[k].values.length);
    const amount = reelsConfig.amount.values[idx('amount')] + state.amountFine;
    const modeVal = reelsConfig.mode.values[idx('mode')];
    const categoryVal = reelsConfig.category.values[idx('category')];
    clearTimeout(toastTimer); clearTimeout(flashTimer);
    state.flashDelta = amount;
    state.toastText = `Added ₹${amount.toLocaleString('en-IN')} · ${modeVal} · ${categoryVal}`;
    addTransaction({ category: categoryVal, amount, mode: modeVal, timestamp: Date.now() });
    renderTotals(); renderToast();
    flashTimer = setTimeout(() => { state.flashDelta = null; renderTotals(); }, 1400);
    toastTimer = setTimeout(() => { state.toastText = null; renderToast(); }, 2200);
  }

  function toggleTheme(){
    buzz(6);
    state.theme = isDark() ? 'light' : 'dark';
    applyTheme();
  }

  function applyTheme(){
    screenEl.setAttribute('data-theme', state.theme);
    document.documentElement.setAttribute('data-theme', state.theme);
    themeToggleEl.innerHTML = isDark() ? MOON_ICON : SUN_ICON;
    renderAll();
  }

  function setView(v){
    state.view = v;
    entryViewEl.style.display = v === 'entry' ? '' : 'none';
    historyViewEl.style.display = v === 'history' ? '' : 'none';
    titleEl.textContent = v === 'entry' ? 'Scroll n Add' : 'Transactions';
    if (v === 'entry'){
      navChipEl.classList.remove('chip-ghost');
      navChipEl.innerHTML = HISTORY_ICON;
      navChipEl.title = 'Transactions';
      themeToggleEl.style.display = '';
      backChipEl.style.display = 'none';
    } else {
      // Back moves to the far right on this screen; install/theme are
      // already reachable from the home screen so they're hidden here
      // rather than duplicated. navChip stays in the DOM (ghosted, not
      // removed) purely so the title keeps the same centered layout.
      navChipEl.classList.add('chip-ghost');
      navChipEl.innerHTML = '';
      themeToggleEl.style.display = 'none';
      backChipEl.style.display = '';
    }
    updateInstallUI();
    if (v === 'history') renderHistory();
  }

  // --- installable app (PWA) ---
  // A literal OS home-screen widget isn't something a website can create -
  // that needs a native app (iOS has no web API for it at all; Android's
  // equivalent is an experimental, Chrome-only origin trial, not something
  // reliable to ship here). What we *can* do, and what this wires up: a
  // real "Install" button backed by the browser's install prompt, so the
  // app gets a home-screen icon and opens full-screen like a native app,
  // plus long-press shortcuts on that icon (see manifest.webmanifest).
  let deferredInstallPrompt = null;
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }
  function updateInstallUI(){
    if (isStandalone() || state.view !== 'entry'){ installChipEl.style.display = 'none'; return; }
    installChipEl.style.display = (deferredInstallPrompt || isIOS()) ? '' : 'none';
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    updateInstallUI();
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    updateInstallUI();
  });
  installChipEl.addEventListener('pointerup', async () => {
    buzz(6);
    if (deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      updateInstallUI();
    } else if (isIOS()){
      clearTimeout(toastTimer);
      state.toastText = 'On iPhone: tap Share, then "Add to Home Screen"';
      renderToast();
      toastTimer = setTimeout(() => { state.toastText = null; renderToast(); }, 3200);
    }
  });

  function updateSyncUI(){
    if (!isFirebaseConfigured()){ syncBarEl.style.display = 'none'; return; }
    syncBarEl.style.display = '';
    if (state.user){
      syncInfoEl.textContent = 'Synced as ' + (state.user.email || state.user.displayName || 'you');
      syncBtnEl.textContent = 'Sign out';
    } else {
      syncInfoEl.textContent = 'Saved on this device only';
      syncBtnEl.textContent = 'Sign in with Google';
    }
  }

  async function syncReelValuesToCloud(){
    if (!(fb && state.user)) return;
    try {
      await fb.fsMod.setDoc(reelValuesDocRef(), {
        category: reelsConfig.category.values,
        mode: reelsConfig.mode.values,
        amountByCategory,
      });
    } catch(e){ console.error('Failed to sync category/mode/amount lists to the cloud', e); }
  }

  // Re-derives everything that depends on the category/mode/amount lists
  // after they change out from under the app (a remote sync landing, or
  // reverting to the local copy on sign-out). Deliberately does NOT go
  // through handleCategoryChange - that also runs the auto-fill prediction
  // and spins the reel, which would be a surprising side effect of a sync
  // event the user didn't actually trigger.
  function finishReelValuesRefresh(){
    ['category', 'mode'].forEach(k => {
      const len = reelsConfig[k].values.length;
      state.positions[k] = Math.min(mod(Math.round(state.positions[k]), len), len - 1);
      state.velocities[k] = 0;
    });
    reelsConfig.amount.values = getAmountValuesForCategory(currentCategoryValue());
    order.forEach(renderReel);
    renderCta();
    if (manageKey) renderManageList();
  }

  function applyRemoteReelValues(data){
    if (Array.isArray(data.category) && data.category.length) reelsConfig.category.values = data.category;
    if (Array.isArray(data.mode) && data.mode.length) reelsConfig.mode.values = data.mode;
    if (data.amountByCategory && typeof data.amountByCategory === 'object') amountByCategory = data.amountByCategory;
    saveReelValues(); // mirror locally so sign-out / offline still shows last-known data
    finishReelValuesRefresh();
  }

  async function onSignedIn(user){
    state.user = user;
    updateSyncUI();

    // One-time merge: push any purely local (never-synced) transactions up
    // to this account, so switching to cloud sync doesn't lose device data.
    const localOnly = loadTransactions().filter(t => !t.cloud);
    for (const t of localOnly){
      try {
        await fb.fsMod.addDoc(collectionRef(), { category: t.category, amount: t.amount, mode: t.mode, timestamp: t.timestamp });
      } catch(e){ console.error('Could not migrate a local transaction to the cloud', e); }
    }

    if (unsubscribeSnapshot) unsubscribeSnapshot();
    const q = fb.fsMod.query(collectionRef(), fb.fsMod.orderBy('timestamp', 'desc'));
    unsubscribeSnapshot = fb.fsMod.onSnapshot(q, snap => {
      state.transactions = snap.docs.map(d => ({ id: d.id, cloud: true, ...d.data() }));
      saveTransactions(); // mirror locally so sign-out / offline still shows last-known data
      renderTotals();
      renderCta();
      if (state.view === 'history') renderHistory();
    }, err => console.error('Firestore sync error', err));

    // Custom categories/modes/amounts: adopt the cloud copy if this account
    // already has one, otherwise seed the cloud from whatever's on this
    // device (so the first device to sign in doesn't lose its customizations).
    try {
      const rvSnap = await fb.fsMod.getDoc(reelValuesDocRef());
      if (rvSnap.exists()) applyRemoteReelValues(rvSnap.data());
      else await syncReelValuesToCloud();
    } catch(e){ console.error('Failed to load synced category/mode/amount lists', e); }
    if (unsubscribeReelValues) unsubscribeReelValues();
    unsubscribeReelValues = fb.fsMod.onSnapshot(reelValuesDocRef(), snap => {
      if (snap.exists()) applyRemoteReelValues(snap.data());
    }, err => console.error('Reel-values sync error', err));
  }

  function onSignedOut(){
    state.user = null;
    updateSyncUI();
    if (unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    if (unsubscribeReelValues){ unsubscribeReelValues(); unsubscribeReelValues = null; }
    state.transactions = loadTransactions();
    const saved = loadReelValues();
    if (saved){
      if (Array.isArray(saved.category) && saved.category.length) reelsConfig.category.values = saved.category;
      if (Array.isArray(saved.mode) && saved.mode.length) reelsConfig.mode.values = saved.mode;
      if (saved.amountByCategory && typeof saved.amountByCategory === 'object') amountByCategory = saved.amountByCategory;
    }
    finishReelValuesRefresh();
    renderTotals();
    renderCta();
    if (state.view === 'history') renderHistory();
  }

  themeToggleEl.addEventListener('pointerup', toggleTheme);
  totalToggleEl.addEventListener('pointerup', () => {
    buzz(6);
    state.showTotal = !state.showTotal;
    renderTotals();
  });
  ctaBtnEl.addEventListener('pointerup', logExpense);
  navChipEl.addEventListener('pointerup', () => {
    buzz(6);
    setView(state.view === 'entry' ? 'history' : 'entry');
  });
  backChipEl.addEventListener('pointerup', () => {
    buzz(6);
    setView('entry');
  });
  historyClearEl.addEventListener('pointerup', async () => {
    if (!state.transactions.length) return;
    const ok = await showConfirmModal({ title: 'Clear all transactions?', message: 'This cannot be undone.', okText: 'Clear all' });
    if (!ok) return;
    if (fb && state.user){
      try {
        const snap = await fb.fsMod.getDocs(collectionRef());
        const batch = fb.fsMod.writeBatch(fb.db);
        snap.forEach(d => batch.delete(d.ref));
        await batch.commit();
      } catch(e){ console.error('Failed to clear cloud transactions', e); }
    } else {
      state.transactions = [];
      saveTransactions();
      renderHistory();
    }
  });
  async function deleteTransaction(t, rowEl){
    const ok = await showConfirmModal({
      title: 'Delete transaction?',
      message: `"${t.category} · ₹${t.amount.toLocaleString('en-IN')}" will be permanently removed.`,
    });
    if (!ok) return;
    if (fb && state.user && t.cloud){
      try {
        await fb.fsMod.deleteDoc(fb.fsMod.doc(collectionRef(), t.id));
        // onSnapshot listener re-renders once Firestore confirms the delete.
      } catch(e){ console.error('Failed to delete cloud transaction', e); }
    } else {
      state.transactions = state.transactions.filter(x => x.id !== t.id);
      saveTransactions();
      // Remove just this row instead of tearing down and rebuilding the
      // whole list: rebuilding put a brand-new element under the finger
      // right as it lifted, which the browser read as tapping/highlighting
      // whatever row ended up there.
      if (rowEl && state.transactions.length){
        rowEl.remove();
        updateHistorySummary();
      } else {
        renderHistory();
      }
      renderTotals();
    }
  }

  historyExportEl.addEventListener('pointerup', exportCSV);

  function showErrorToast(text, ms = 4200){
    clearTimeout(toastTimer);
    state.toastText = text;
    renderToast();
    toastTimer = setTimeout(() => { state.toastText = null; renderToast(); }, ms);
  }

  // Firebase auth errors are opaque by default (silently logged to the
  // console, which nobody checks on a phone) - surface something a user can
  // actually act on.
  function describeAuthError(e){
    const code = e && e.code;
    if (code === 'auth/unauthorized-domain') return 'This domain isn\'t authorized in Firebase yet - add it under Authentication -> Settings -> Authorized domains.';
    if (code === 'auth/operation-not-allowed') return 'Google sign-in isn\'t enabled on this Firebase project yet - enable it under Authentication -> Sign-in method.';
    if (code === 'auth/network-request-failed') return 'Sign-in failed - check your connection and try again.';
    if (code === 'auth/popup-blocked') return 'Your browser blocked the sign-in popup - allow popups for this site and try again.';
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return null; // user backed out, not an error
    return 'Sign-in failed: ' + (code || (e && e.message) || 'unknown error');
  }

  syncBtnEl.addEventListener('pointerup', async () => {
    if (!fb) return;
    buzz(6);
    try {
      if (state.user){
        await fb.authMod.signOut(fb.auth);
      } else {
        // Deliberately popup-only: signInWithRedirect looks appealing for
        // mobile/installed PWAs, but it round-trips through Firebase's own
        // auth-handler page and relies on session storage surviving that
        // trip. Inside an installed PWA on Android that storage isn't
        // reliably preserved, and the redirect dead-ends on Firebase's own
        // "The requested action is invalid" error page - not something
        // this app's error handling can even catch, since the browser has
        // fully navigated away. Popup keeps the failure recoverable.
        await fb.authMod.signInWithPopup(fb.auth, new fb.authMod.GoogleAuthProvider());
      }
    } catch(e){
      console.error('Sign-in/out failed', e);
      let msg = describeAuthError(e);
      if (msg && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') && isStandalone()){
        msg = 'Google sign-in doesn\'t work reliably inside the installed app on Android. Open this site in Chrome (not the installed icon) to sign in - your data will still sync afterward.';
      }
      if (msg) showErrorToast(msg, 6000);
    }
  });

  function csvEscape(value){
    const s = String(value);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCSV(){
    if (!state.transactions.length) return;
    const rows = [['Date', 'Time', 'Category', 'Amount (INR)', 'Mode']];
    [...state.transactions]
      .sort((a, b) => a.timestamp - b.timestamp)
      .forEach(t => {
        const d = new Date(t.timestamp);
        rows.push([
          d.toLocaleDateString('en-CA'),
          d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
          t.category,
          t.amount,
          t.mode,
        ]);
      });
    const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'roulette-wallet-transactions-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function renderReel(key){
    const cfg = reelsConfig[key];
    const len = cfg.values.length;
    const p = state.positions[key];
    const base = Math.floor(p);
    const { slots } = reelEls[key];
    for (let j = -2; j <= 2; j++){
      const abs = base + j;
      const value = cfg.values[mod(abs, len)];
      const dist = Math.abs(abs - p);
      const ty = (abs - p) * ITEM_H;
      const scale = 1 - Math.min(dist, 2) * 0.16;
      const isCenter = dist < 0.5;
      const displayValue = (key === 'amount' && isCenter) ? value + state.amountFine : value;
      const { wrap, label } = slots[j + 2];
      label.textContent = cfg.format(displayValue);
      wrap.style.transform = `translateY(calc(-50% + ${ty}px)) scale(${scale})`;
      wrap.style.fontSize = isCenter ? '18px' : '14px';
      wrap.style.fontWeight = isCenter ? '700' : '500';
      wrap.style.color = isCenter ? 'var(--primary-text)' : `rgba(var(--fg-rgb),${Math.max(0.18, 1 - dist*0.42)})`;
    }
  }

  function selectedLabel(key){
    const cfg = reelsConfig[key];
    const selIdx = mod(Math.round(state.positions[key]), cfg.values.length);
    let v = cfg.values[selIdx];
    if (key === 'amount') v += state.amountFine;
    return cfg.format(v);
  }

  function renderCta(){
    ctaPreviewEl.textContent = `${selectedLabel('category')} · ${selectedLabel('amount')} · ${selectedLabel('mode')}`;
  }

  function renderTotals(){
    const currentMode = selectedLabel('mode');
    const { total, byMode } = computeMonthTotals();
    const displayedTotal = state.showTotal ? total : (byMode[currentMode] || 0);
    amountTextEl.textContent = '₹' + displayedTotal.toLocaleString('en-IN');
    if (state.flashDelta != null){
      flashTextEl.textContent = '+₹' + state.flashDelta.toLocaleString('en-IN');
      flashTextEl.classList.add('show');
    } else {
      flashTextEl.classList.remove('show');
    }
    toggleTrackEl.classList.toggle('on', state.showTotal);
    subtitleEl.classList.toggle('show', !state.showTotal);
    subtitleEl.textContent = 'via ' + currentMode;
  }

  function renderToast(){
    if (state.toastText){
      toastEl.textContent = state.toastText;
      toastEl.classList.add('show');
    } else {
      toastEl.classList.remove('show');
    }
  }

  function formatHistoryDate(ts){
    const d = new Date(ts);
    const now = new Date();
    const time = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today · ' + time;
    const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday · ' + time;
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' · ' + time;
  }

  function updateHistorySummary(){
    const count = state.transactions.length;
    historyCountEl.textContent = count + (count === 1 ? ' transaction' : ' transactions');
    const total = state.transactions.reduce((s, t) => s + t.amount, 0);
    historyTotalEl.textContent = '₹' + total.toLocaleString('en-IN');
    historyClearEl.style.display = count ? '' : 'none';
    historyExportEl.style.display = count ? '' : 'none';
  }

  function renderHistory(){
    const txs = [...state.transactions].sort((a, b) => b.timestamp - a.timestamp);
    updateHistorySummary();

    historyListEl.innerHTML = '';
    if (!txs.length){
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'No expenses logged yet.';
      historyListEl.appendChild(empty);
      return;
    }
    txs.forEach(t => {
      const row = document.createElement('div');
      row.className = 'history-row';

      const left = document.createElement('div');
      left.className = 'history-left';
      const cat = document.createElement('div');
      cat.className = 'history-cat';
      cat.textContent = t.category;
      const modeLine = document.createElement('div');
      modeLine.className = 'history-mode';
      modeLine.textContent = t.mode + ' · ' + formatHistoryDate(t.timestamp);
      left.appendChild(cat);
      left.appendChild(modeLine);

      const amt = document.createElement('div');
      amt.className = 'history-amount';
      amt.textContent = '₹' + t.amount.toLocaleString('en-IN');

      const del = document.createElement('div');
      del.className = 'history-delete';
      del.title = 'Delete';
      del.innerHTML = TRASH_ICON;
      del.addEventListener('pointerup', (e) => { e.stopPropagation(); deleteTransaction(t, row); });

      row.appendChild(left);
      row.appendChild(amt);
      row.appendChild(del);
      historyListEl.appendChild(row);
    });
  }

  function renderAll(){
    order.forEach(renderReel);
    renderTotals();
    renderCta();
    renderToast();
    if (state.view === 'history') renderHistory();
  }

  function tick(t){
    if (lastT == null) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.04);
    lastT = t;
    const { decay, k, c } = FEEL;
    let moved = false;
    order.forEach(key => {
      if (state.dragging[key]) return;
      let p = state.positions[key], v = state.velocities[key];
      if (Math.abs(v) > 0.5){
        p += v * dt;
        v *= Math.pow(decay, dt);
        moved = true;
      } else {
        const target = Math.round(p);
        const diffV = target - p;
        if (Math.abs(diffV) < 0.0008 && Math.abs(v) < 0.01){
          p = target; v = 0;
        } else {
          const accel = k * diffV - c * v;
          v += accel * dt;
          p += v * dt;
          moved = true;
        }
      }
      state.positions[key] = p; state.velocities[key] = v;
      const roundedIdx = Math.round(p);
      if (lastTickIdx[key] !== roundedIdx){
        lastTickIdx[key] = roundedIdx;
        buzz(6);
      }
      const settled = v === 0 && p === Math.round(p);
      if (settled && !wasSettled[key]) buzz(16);
      if (key === 'category' && settled && !wasSettled.category){
        const val = reelsConfig.category.values[mod(Math.round(p), reelsConfig.category.values.length)];
        if (val !== lastCategoryValue){
          lastCategoryValue = val;
          handleCategoryChange(val);
        }
      }
      wasSettled[key] = settled;
    });
    requestAnimationFrame(tick);
    if (moved){
      order.forEach(renderReel);
      renderTotals();
      renderCta();
    }
  }

  setView(location.hash === '#history' ? 'history' : 'entry');
  applyTheme();
  requestAnimationFrame(tick);
  updateInstallUI();

  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('Service worker registration failed', e));
  }

  fb = await initFirebase();
  updateSyncUI();
  if (fb){
    fb.authMod.onAuthStateChanged(fb.auth, user => {
      if (user) onSignedIn(user); else onSignedOut();
    });
  }
})();
</script>
</body>
</html>
